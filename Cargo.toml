[package]
name = "usage-monitor"
version = "0.8.0"
edition = "2021"
license = "Apache-2.0"
description = "Floating bubble showing Claude Code and Codex usage"
homepage = "https://github.com/tiennm99/usage-monitor"
repository = "https://github.com/tiennm99/usage-monitor"

[lib]
name = "usage_monitor_lib"
path = "src/lib.rs"

[[bin]]
name = "usage-monitor"
path = "src/main.rs"

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-single-instance = "2"
# rustls with the OS verifier keeps corporate roots trusted; gzip is a default.
# socks-proxy serves SOCKS environment proxies such as ALL_PROXY=socks5h://.
ureq = { version = "3", features = ["platform-verifier", "socks-proxy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
log = "0.4"
simplelog = "0.12"
thiserror = "2"
tiny-skia = "0.11"
self-replace = "1.5"
tauri-plugin-notification = "2"
tauri-plugin-updater = "2"
# Not used directly: Cargo's feature unification turns `socks` on for the
# updater plugin's reqwest, so update requests can use a SOCKS env proxy.
# Keep the major in step with the plugin's (`cargo tree -i reqwest`).
reqwest = { version = "0.13", default-features = false, features = ["socks"] }

# Windows and Linux write their start-at-login entries themselves.
[target.'cfg(not(any(windows, target_os = "linux")))'.dependencies]
tauri-plugin-autostart = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.14"
libloading = "0.9"
# Same major as the copy tao pulls; reads the portal colour scheme.
dbus = "0.9"

[target.'cfg(windows)'.dependencies]
# Keep the major in step with the `windows` crate tauri pulls
# (`cargo tree -i windows`), so only one copy is compiled.
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
] }
# Same major as tauri's; used for the WebView2 runtime check.
webview2-com = "0.39"
# Same major as the copy auto-launch pulls; reads the system proxy.
windows-registry = "0.6"
# The start-at-login entry, pinned to the current user (the autostart
# plugin's builder cannot set that mode).
auto-launch = "0.6"

[dev-dependencies]
flate2 = "1"
# The crypto provider the updater plugin installs before its reqwest client
# is built; the SOCKS update test builds such a client itself.
rustls = { version = "0.23", default-features = false, features = ["ring"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
panic = "abort"
